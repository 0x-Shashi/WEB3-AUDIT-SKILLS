# WEB3-AUDIT-SKILLS Antigravity Configuration
# This file configures hooks and behaviors for Antigravity CLI

name: web3-audit-skills
version: "1.0.0"
description: >
  Comprehensive Web3 security audit skills including attack trees,
  anti-patterns, exploit forensics, and protocol playbooks.

# Skills available
skills:
  - attack-trees
  - anti-patterns
  - patterns
  - exploit-forensics
  - protocol-playbooks
  - templates
  - methodology

# Behavioral hooks for audit context management
hooks:
  # Before exploring code, re-read the audit plan
  PreToolUse:
    - matcher: "view_file|grep_search|read"
      command: "cat audit_plan.md 2>/dev/null | head -30 || true"
      description: "Re-read audit plan before exploring code"
    
    - matcher: "web_search|browser"
      command: "echo '[Reminder] After 2 searches, update findings_report.md'"
      description: "Reminder for 2-Action Rule"

  # After writing PoC or test files, prompt to update findings
  PostToolUse:
    - matcher: "write_to_file|edit_file"
      command: |
        if echo "$1" | grep -qE '\.(t\.sol|test\.sol)$'; then
          echo '[Audit] PoC file detected. If exploit successful, update findings_report.md'
        fi
      description: "Remind to document successful PoCs"
    
    - matcher: "write_to_file"
      command: "echo '[Audit] File updated. If this completes a review, update progress.md'"
      description: "Remind to update progress"

  # On session end, remind to save state
  Stop:
    - command: |
        echo '========================================='
        echo 'AUDIT SESSION ENDING'
        echo '========================================='
        echo 'Before stopping, ensure you have updated:'
        echo '  1. progress.md - Log what you reviewed'
        echo '  2. findings_report.md - Document discoveries'
        echo '  3. audit_plan.md - Mark completed branches'
        echo '========================================='
      description: "Session end reminder"

# Tool permissions
allowed-tools:
  - Read
  - Write
  - Edit
  - Bash
  - Glob
  - Grep
  - WebFetch
  - WebSearch

# Custom commands
commands:
  audit-start:
    description: "Initialize a new audit session"
    action: |
      cp skills/templates/audit_plan.md ./audit/
      cp skills/templates/threat_model.md ./audit/
      cp skills/templates/findings_report.md ./audit/
      cp skills/templates/progress.md ./audit/
      echo "Audit files created in ./audit/"
  
  audit-status:
    description: "Show current audit progress"
    action: |
      echo "=== Audit Status ==="
      grep -A3 "## Current Phase" audit_plan.md 2>/dev/null || echo "No audit_plan.md found"
      echo ""
      echo "=== Recent Findings ==="
      grep -E "^### \[" findings_report.md 2>/dev/null | tail -5 || echo "No findings yet"
  
  audit-checkpoint:
    description: "Quick checkpoint - update all tracking files"
    action: |
      echo "Update the following files:"
      echo "  1. audit_plan.md - Attack tree progress"
      echo "  2. findings_report.md - New findings"
      echo "  3. progress.md - Session log"
