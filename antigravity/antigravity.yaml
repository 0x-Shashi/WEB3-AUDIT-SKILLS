# Antigravity Configuration
# Web3 Security Audit Plugin

name: web3-security-audit
version: 1.0.0
description: Comprehensive Web3 smart contract security audit plugin for Antigravity. Provides vulnerability scanning for 6 blockchains, Cyfrin Solodit integration with 50,000+ findings, and complete audit lifecycle management.

# Platform
platform: antigravity
engine: ">=1.0.0"

# Metadata
author: Web3 Security
homepage: https://solodit.cyfrin.io
license: MIT

# Categories
tags:
  - security
  - audit
  - smart-contracts
  - web3
  - blockchain
  - solidity
  - solana
  - cairo
  - move
  - cosmos
  - ton
  - defi
  - vulnerability

# Skills Configuration
skills:
  cyfrin-findings:
    path: skills/cyfrin-findings/
    description: "50,000+ real audit findings from Cyfrin Solodit"
    triggers:
      - "find vulnerabilities"
      - "query solodit"
      - "research attacks"
      - "audit findings"
  
  audit-context:
    path: skills/audit-context/
    description: "Deep line-by-line code analysis and threat modeling"
    triggers:
      - "analyze code"
      - "understand function"
      - "context building"
      - "threat model"
  
  solidity-scanner:
    path: skills/solidity-scanner/
    description: "Ethereum/EVM vulnerability patterns"
    triggers:
      - "scan solidity"
      - "evm vulnerabilities"
      - "ethereum security"
    file_patterns:
      - "*.sol"
  
  solana-scanner:
    path: skills/solana-scanner/
    description: "Solana/Anchor security patterns"
    triggers:
      - "solana security"
      - "anchor program"
      - "cpi check"
    file_patterns:
      - "*.rs"
  
  cairo-scanner:
    path: skills/cairo-scanner/
    description: "StarkNet/Cairo security patterns"
    triggers:
      - "starknet"
      - "cairo contract"
    file_patterns:
      - "*.cairo"
  
  move-scanner:
    path: skills/move-scanner/
    description: "Aptos/Sui Move security patterns"
    triggers:
      - "aptos"
      - "sui"
      - "move contract"
    file_patterns:
      - "*.move"
  
  cosmos-scanner:
    path: skills/cosmos-scanner/
    description: "Cosmos SDK/CosmWasm patterns"
    triggers:
      - "cosmos sdk"
      - "ibc"
      - "cosmwasm"
  
  ton-scanner:
    path: skills/ton-scanner/
    description: "TON/FunC security patterns"
    triggers:
      - "ton contract"
      - "func"
      - "tact"
    file_patterns:
      - "*.fc"
      - "*.tact"
  
  token-analyzer:
    path: skills/token-analyzer/
    description: "30+ weird ERC20 token behaviors"
    triggers:
      - "token integration"
      - "erc20"
      - "weird tokens"
  
  spec-compliance:
    path: skills/spec-compliance/
    description: "EIP/ERC standard verification"
    triggers:
      - "eip compliance"
      - "erc standard"
      - "spec verification"
  
  static-analysis:
    path: skills/static-analysis/
    description: "Slither, Mythril, Semgrep integration"
    triggers:
      - "slither"
      - "mythril"
      - "static analysis"
  
  variant-analysis:
    path: skills/variant-analysis/
    description: "Find similar bugs using SCARV methodology"
    triggers:
      - "find similar"
      - "variant"
      - "pattern search"
  
  fix-review:
    path: skills/fix-review/
    description: "Verify fixes using CORRECT methodology"
    triggers:
      - "verify fix"
      - "fix review"
      - "remediation"
  
  differential-review:
    path: skills/differential-review/
    description: "Version comparison and upgrade safety"
    triggers:
      - "diff review"
      - "version compare"
      - "upgrade safety"
  
  report-writer:
    path: skills/report-writer/
    description: "Professional audit report generation"
    triggers:
      - "generate report"
      - "write finding"
      - "audit report"

  # NEW: Comprehensive extracted skills
  vulnerability-patterns:
    path: skills/patterns/
    description: "250+ vulnerability patterns including DeFi, L2, bridges"
    triggers:
      - "vulnerability patterns"
      - "defi vulnerabilities"
      - "l2 security"
      - "bridge security"
  
  checklists:
    path: skills/checklists/
    description: "50+ audit checklist items with SWC codes"
    triggers:
      - "checklist"
      - "audit checklist"
      - "comprehensive check"
  
  methodology:
    path: skills/methodology/
    description: "LLM audit workflow, 5-phase approach, SCAN modes"
    triggers:
      - "audit workflow"
      - "llm methodology"
      - "scan mode"
      - "attack vectors"

# Commands
commands:
  audit-start:
    description: "Initialize a new security audit project"
    usage: "/audit-start <project-name>"
  
  audit-scan:
    description: "Scan current file for vulnerabilities"
    usage: "/audit-scan [--deep]"
  
  audit-search:
    description: "Search Solodit vulnerability database"
    usage: "/audit-search <query>"
  
  audit-report:
    description: "Generate professional audit report"
    usage: "/audit-report [--format=md|pdf]"
  
  check-reentrancy:
    description: "Check for reentrancy vulnerabilities"
    usage: "/check-reentrancy"
  
  check-access:
    description: "Analyze access control patterns"
    usage: "/check-access"
  
  check-tokens:
    description: "Check token integration safety"
    usage: "/check-tokens"
  
  finding:
    description: "Log a new security finding"
    usage: "/finding <severity> <title>"
  
  findings:
    description: "List all documented findings"
    usage: "/findings [--severity=X]"
  
  slither:
    description: "Run Slither static analysis"
    usage: "/slither [--detector=X]"
  
  diff:
    description: "Compare contract versions"
    usage: "/diff <v1> <v2>"

# Environment
environment:
  CYFRIN_API_KEY:
    description: "API key for Cyfrin Solodit"
    required: false
